{#- Edit and delete for one row, in both tables. Delete is a form rather than a
    link because it changes something, and it asks first: there is no undo. -#}
<span class="inline">
  <a href="/events/{{ e['id'] }}">Edit</a>
  <form method="post" action="/events/{{ e['id'] }}/delete" style="display: inline">
    <button class="quiet" type="submit"
            onclick="return confirm('Delete {{ e['theme'] }}? Its wine list goes too.')">Delete</button>
  </form>
</span>
